[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwgh"
version = "0.1.0"
description = "STK + Python C-side satellite imaging & datalink simulation framework"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "comtypes>=1.4",
    "pydantic>=2",
    "pyyaml>=6",
    "crcmod",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt"]

[project.scripts]
rwgh = "rwgh.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
